name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_call:

permissions:
  contents: read

env:
  poetry_version: "2.5.1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python_version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install poetry
        run: pipx install poetry~=${{ env.poetry_version }}

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
          cache: 'poetry'
          cache-dependency-path: poetry.lock

      - name: Install dependencies
        run: poetry install --with=dev --all-extras --no-interaction
      - name: Black
        run: poetry run black --check .
      - name: Isort
        run: poetry run isort --check-only .
      - name: Mypy
        run: poetry run mypy .
      - name: Pylint
        run: poetry run pylint .
      - name: Pytest
        run: poetry run pytest --cov --cov-fail-under=90

  test-benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python_version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install poetry
        run: pipx install poetry~=${{ env.poetry_version }}

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
          cache: 'poetry'
          cache-dependency-path: benchmark/poetry.lock

      - name: Install dependencies
        run: poetry -C benchmark install --with=dev --no-interaction
      - name: Black
        run: poetry -C benchmark run black --check .
      - name: Isort
        run: poetry -C benchmark run isort --check-only .
      - name: Mypy
        run: poetry -C benchmark run mypy .
      - name: Pylint
        run: poetry -C benchmark run pylint .
