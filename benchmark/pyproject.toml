[tool.poetry]
name = "eventlib-py-benchmark"
version = "0.0.0"
description = "Benchmarks and profiling tools for the eventlib-py library."
authors = ["Michael Käser <info@mickare.de>"]
license = "(Apache-2.0 OR MIT)"
readme = "README.md"
packages = [{ include = "benchmark" }]

[tool.poetry.scripts]
benchmark = "benchmark.cli:main"

[tool.poetry.dependencies]
python = "^3.12"
eventlib-py = { path = "..", develop = true }
# pyperf is the harness itself, not an optional extra: `run` needs it.
pyperf = "^2.10.0"
# Rendering only; the measurement path never imports matplotlib.
matplotlib = "^3.11"
# Event declarations used by the `journey` cases.
attrs = "^24.2"
pydantic = "^2.8"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
pylint = "^4.1.3"
mypy = "^2.4"
black = "^26.10.1"
isort = "^9.0.2"

[tool.poetry.group.profiler.dependencies]
# Sampling / tracing profilers. pyperf lives in the main group because it is the harness.
pyinstrument = "^5.1.3"
line-profiler = "^5.1.0"
py-spy = "^0.4.2"
memray = "^1.20.0"
viztracer = "^1.1.1"
pandas = "^3.0"
pandas-stubs = "*"
types-tqdm = "*"
tqdm = "^4.66"
tabulate = "^0.9"

# ==================================================================================================
# Pytest
[tool.pytest.ini_options]
# Without this section the repository-root pyproject.toml wins rootdir detection, which puts the
# repository root on sys.path. `benchmark/` is then importable as a namespace package and shadows
# this project's own `benchmark` package.
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]

# ==================================================================================================
# Mypy

[tool.mypy]
python_version = "3.12"
mypy_path = ".."
warn_return_any = true
warn_unused_configs = true
exclude = ["^\\.?venv"]

# ==================================================================================================
# Pylint
[tool.pylint.master]
recursive = true
output-format = "colorized"
ignore = [
    "venv",
    ".venv",
    ".run",
    ".vscode",
    ".idea",
    ".mypy_cache",
    ".pytest_cache",
    "build",
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.basic]
class-rgx = "[A-Z_][a-zA-Z0-9]*$"

# ==================================================================================================
# Black
[tool.black]
line-length = 120
target-version = ['py312']

# ==================================================================================================
# Isort
[tool.isort]
py_version = "312"
line_length = 120
profile = "black"
src_paths = ["."]
