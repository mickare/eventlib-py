[tool.poetry]
name = "eventlib-py-benchmark"
version = "0.0.0"
description = "Benchmarks for the eventlib-py library."
authors = ["Michael Käser <info@mickare.de>"]
license = "(Apache-2.0 OR MIT)"
readme = "README.md"
packages = [{ include = "benchmark" }]

[tool.poetry.scripts]
benchmark = "benchmark.benchmark:benchmark_cli"

[tool.poetry.dependencies]
python = "^3.12"
eventlib-py = { path = "..", develop = true }
numpy = "^2.5"
matplotlib = "^3.11"
pandas = "^3.0"
tqdm = "^4.66"
tabulate = "^0.9"
attrs = "^24.2"
pydantic = "^2.8"

[tool.poetry.group.dev.dependencies]
pandas-stubs = "*"
types-tqdm = "*"
pylint = "^4.0.6"
mypy = "^1.11"
black = "^26.5.1"
isort = "^8.0.1"

# ==================================================================================================
# Mypy
[tool.mypy]
python_version = "3.12"
mypy_path = ".."
warn_return_any = true
warn_unused_configs = true
exclude = ["^\\.?venv"]

# ==================================================================================================
# Pylint
[tool.pylint.master]
recursive = true
output-format = "colorized"
ignore = [
    "venv",
    ".venv",
    ".run",
    ".vscode",
    ".idea",
    ".mypy_cache",
    ".pytest_cache",
    "build",
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.basic]
class-rgx = "[A-Z_][a-zA-Z0-9]*$"

# ==================================================================================================
# Black
[tool.black]
line-length = 120
target-version = ['py312']

# ==================================================================================================
# Isort
[tool.isort]
py_version = "312"
line_length = 120
profile = "black"
src_paths = ["."]
